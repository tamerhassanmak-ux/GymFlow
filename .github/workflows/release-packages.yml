name: Build release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify tag matches application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version"))')
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Test and build application
        run: mvn -B verify
      - name: Build Linux installer and test bundled runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          bash packaging/linux/build.sh
      - name: Build Windows installers and test bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports-${{ matrix.platform }}
          path: target/surefire-reports/
      - uses: actions/upload-artifact@v6
        with:
          name: GymFlow-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            target/installers/*.deb
            target/installers/*.exe
            target/installers/*.msi
            target/installers/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish verified Linux and Windows packages
    needs: installers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify both platform builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "GymFlow-${GITHUB_REF_NAME}-linux" --dir linux
          gh run download "$GITHUB_RUN_ID" --name "GymFlow-${GITHUB_REF_NAME}-windows" --dir windows
          (cd linux && sha256sum -c SHA256SUMS)
          (cd windows && sha256sum -c SHA256SUMS)
          mv linux/SHA256SUMS linux/SHA256SUMS-linux.txt
          mv windows/SHA256SUMS windows/SHA256SUMS-windows.txt
      - name: Publish release with verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "GymFlow $GITHUB_REF_NAME" \
            --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md" \
            linux/*.deb windows/*.exe windows/*.msi \
            linux/SHA256SUMS-linux.txt windows/SHA256SUMS-windows.txt
