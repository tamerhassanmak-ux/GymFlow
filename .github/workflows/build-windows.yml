name: GymFlow stability verification and packages
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/1.0.6-stability]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - run: mvn -B verify
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox >/tmp/gymflow-wm.log 2>&1 & mvn -B -Dtest=DatabaseWizardUiTest -Dgymflow.ui=true test'
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox >/tmp/gymflow-wm.log 2>&1 & mvn -B -Dtest=ResponsiveUiTest -Dgymflow.ui=true test'
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox >/tmp/gymflow-wm.log 2>&1 & mvn -B -Dtest=WindowMaximizeTest -Dgymflow.ui=true test'
      - run: python qa-reports/tests/run_legacy.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-reports-${{ matrix.os }}
          path: target/surefire-reports/
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: MYSQL
            image: mysql:8.0.40
            id: mysql80
          - engine: MYSQL
            image: mysql:8.4.3
            id: mysql84
          - engine: MARIADB
            image: mariadb:10.11.10
            id: maria1011
          - engine: MARIADB
            image: mariadb:11.4.4
            id: maria114
          - engine: SQL_SERVER
            image: mcr.microsoft.com/mssql/server:2022-CU17-ubuntu-22.04
            id: sqlserver2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Pdatabase-integration -Dgymflow.it.engine=${{ matrix.engine }} -Dgymflow.it.image=${{ matrix.image }} verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compatibility-${{ matrix.id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  packages:
    needs: [unit, compatibility]
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - if: runner.os == 'Linux'
        run: bash packaging/linux/build.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb openbox
          mvn -B dependency:get -Dartifact=org.junit.platform:junit-platform-console-standalone:1.12.1 -Dtransitive=false
          xvfb-run -a sh -c 'openbox >/tmp/gymflow-wm.log 2>&1 & bash qa-reports/tests/run_packaged_ui.sh target/installers/GymFlow'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: packaged-ui-reports-${{ matrix.os }}
          path: qa-reports/v1.0.6-ui/packaged/
      - uses: actions/upload-artifact@v6
        with:
          name: GymFlow-1.0.6-${{ matrix.os }}
          path: |
            target/installers/*.deb
            target/installers/*.exe
            target/installers/*.msi
            target/installers/SHA256SUMS
          if-no-files-found: error
# Publication is deliberately absent. Packages remain candidates pending TLS,
# native installer, upgrade and recovery acceptance evidence and explicit approval.
